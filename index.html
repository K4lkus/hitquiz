<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitster Party Quiz</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #121212; color: white; padding: 20px; }
        .card { background: #1e1e1e; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); max-width: 500px; margin-left: auto; margin-right: auto; }
        .hidden { display: none; }
        button { background: #1DB954; border: none; color: white; padding: 12px 24px; border-radius: 25px; cursor: pointer; font-size: 1em; margin: 5px; font-weight: bold; }
        button:active { background: #17a34a; }
        input { padding: 12px; border-radius: 8px; border: 1px solid #333; background: #252525; color: white; width: 80%; margin-bottom: 10px; font-size: 1em; }
        #video-player { position: absolute; left: -9999px; width: 1px; height: 1px; }
        .scoreboard { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; }
        .player-score { background: #282828; padding: 15px; border-radius: 10px; min-width: 120px; border: 1px solid #333; }
        .score-val { font-size: 2.5em; display: block; margin: 5px 0; color: #1DB954; }
        .song-display { color: #ffcc00; font-size: 1.3em; margin-top: 15px; border-top: 1px dashed #444; padding-top: 15px; }
        h2 { color: #1DB954; }
    </style>
</head>
<body>

    <div id="setup-area" class="card">
        <h2>👥 Spiel-Setup</h2>
        <p>Wie viele Personen spielen?</p>
        <button onclick="createPlayerInputs(2)">2 Spieler</button>
        <button onclick="createPlayerInputs(3)">3 Spieler</button>
        <button onclick="createPlayerInputs(4)">4 Spieler</button>
        
        <div id="name-inputs" style="margin-top: 20px;"></div>
        <button id="start-game-btn" class="hidden" onclick="startGame()" style="background: #ffffff; color: #000; margin-top: 20px;">Spiel starten 🚀</button>
    </div>

    <div id="game-area" class="hidden">
        <div class="card">
            <h2 id="status">Warte auf Musik...</h2>
            <iframe id="video-player" src="" frameborder="0" allow="autoplay"></iframe>
            
            <button id="play-btn" class="hidden" onclick="startVideo()" style="font-size: 1.5em; padding: 20px 40px;">▶️ Musik abspielen</button>
            
            <div id="song-info" class="hidden">
                <div class="song-display">
                    <strong id="display-title"></strong><br>
                    <span id="display-year"></span>
                </div>
            </div>

            <br><br>
            <button id="reveal-btn" class="hidden" onclick="revealInfo()" style="background:#444;">👁️ Lösung anzeigen</button>
        </div>

        <div id="scoreboard" class="scoreboard"></div>
        
        <button onclick="resetGame()" style="background:#cc0000; margin-top:40px; font-size: 0.8em; opacity: 0.6;">Runde beenden / Namen löschen</button>
    </div>

    <script>
        // DEINE SONG-LISTE
        const songDatenbank = {
            "song1": { ytId: "dQw4w9WgXcQ", titel: "Never Gonna Give You Up", interpret: "Rick Astley", jahr: 1987 },
            "song2": { ytId: "l482T0yNkeo", titel: "Bohemian Rhapsody", interpret: "Queen", jahr: 1975 },
            "song3": { ytId: "JkK8g6FMEXE", titel: "Despacito", interpret: "Luis Fonsi", jahr: 2017 }
        };

        let currentYtId = "";
        let players = [];

        // WIRD BEIM LADEN AUSGEFÜHRT
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const songId = urlParams.get('id'); 

            // 1. Schauen, ob wir schon Spieler im Speicher haben
            const saved = localStorage.getItem('hitster_players');
            if (saved) {
                players = JSON.parse(saved);
                document.getElementById('setup-area').classList.add('hidden');
                document.getElementById('game-area').classList.remove('hidden');
                renderScoreboard();
            }

            // 2. Song laden, falls ID da
            if (songId && songDatenbank[songId]) {
                const song = songDatenbank[songId];
                currentYtId = song.ytId;
                document.getElementById('status').innerText = "Lied ist bereit!";
                document.getElementById('display-title').innerText = song.titel + " - " + song.interpret;
                document.getElementById('display-year').innerText = "Jahr: " + song.jahr;
                document.getElementById('play-btn').classList.remove('hidden');
                document.getElementById('reveal-btn').classList.remove('hidden');
            }
        };

        function createPlayerInputs(num) {
            const container = document.getElementById('name-inputs');
            container.innerHTML = "<h3>Namen eingeben:</h3>";
            for(let i=1; i<=num; i++) {
                container.innerHTML += `<input type="text" id="name-${i}" placeholder="Name ${i}">`;
            }
            document.getElementById('start-game-btn').classList.remove('hidden');
        }

        function startGame() {
            const inputs = document.querySelectorAll('#name-inputs input');
            players = Array.from(inputs).map(inp => ({ name: inp.value || "Spieler", score: 0 }));
            localStorage.setItem('hitster_players', JSON.stringify(players));
            
            document.getElementById('setup-area').classList.add('hidden');
            document.getElementById('game-area').classList.remove('hidden');
            renderScoreboard();
        }

        function renderScoreboard() {
            const sb = document.getElementById('scoreboard');
            sb.innerHTML = "";
            players.forEach((p, index) => {
                sb.innerHTML += `
                    <div class="player-score">
                        <strong>${p.name}</strong>
                        <span class="score-val" id="score-${index}">${p.score}</span>
                        <button onclick="changeScore(${index}, 1)">+</button>
                        <button onclick="changeScore(${index}, -1)" style="background:#555">-</button>
                    </div>`;
            });
        }

        function changeScore(index, val) {
            players[index].score += val;
            document.getElementById(`score-${index}`).innerText = players[index].score;
            localStorage.setItem('hitster_players', JSON.stringify(players));
        }

        function resetGame() {
            if(confirm("Alle Namen und Punkte löschen?")) {
                localStorage.removeItem('hitster_players');
                window.location.href = window.location.pathname; // Neu laden ohne ID
            }
        }

        function startVideo() {
            if(currentYtId) {
                document.getElementById('video-player').src = "https://www.youtube.com/embed/" + currentYtId + "?autoplay=1";
                document.getElementById('play-btn').innerText = "🎵 Musik läuft...";
            }
        }

        function revealInfo() {
            document.getElementById('song-info').classList.remove('hidden');
        }
    </script>
</body>
</html>

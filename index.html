<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 🎵 Hit-Quiz 🎵 </title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background-color: #121212; color: white; padding: 20px; }
        .card { background: #1e1e1e; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); max-width: 500px; margin-left: auto; margin-right: auto; }
        .hidden { display: none; }
        
        button { background: #1DB954; border: none; color: white; padding: 12px 24px; border-radius: 25px; cursor: pointer; font-size: 1em; margin: 5px; font-weight: bold; transition: 0.2s; }
        button:hover { transform: scale(1.05); background: #1ed760; }
        .btn-secondary { background: #444; }
        .btn-danger { background: #cc0000; font-size: 0.8em; opacity: 0.7; }
        
        input { padding: 12px; border-radius: 8px; border: 1px solid #333; background: #252525; color: white; width: 80%; margin-bottom: 10px; }
        
        #video-player { position: absolute; left: -9999px; width: 1px; height: 1px; }

        .scoreboard { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-top: 20px; align-items: flex-start; }
        .player-score { background: #282828; padding: 15px; border-radius: 10px; min-width: 200px; border: 1px solid #333; text-align: center; }
        .score-val { font-size: 2.5em; display: block; margin: 5px 0; color: #1DB954; font-weight: bold; }
        
        /* TIMELINE STYLES */
        .timeline { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; border-top: 1px solid #444; padding-top: 10px; }
        .timeline-card { background: #333; padding: 10px; border-radius: 8px; border-left: 5px solid #1DB954; text-align: left; animation: fadeIn 0.4s ease-out; font-size: 0.9em; }
        .timeline-year { font-weight: bold; color: #1DB954; margin-right: 8px; font-size: 1.1em; }
        
        .song-display { color: #ffcc00; font-size: 1.3em; margin-top: 15px; border-top: 1px dashed #444; padding-top: 15px; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="setup-area" class="card">
        <h2>👥 Hitster Setup v2</h2>
        <p>Wie viele Personen spielen?</p>
        <button onclick="createPlayerInputs(2)">2 Spieler</button>
        <button onclick="createPlayerInputs(3)">3 Spieler</button>
        <button onclick="createPlayerInputs(4)">4 Spieler</button>
        
        <div id="name-inputs" style="margin-top: 20px;"></div>
        <button id="start-game-btn" class="hidden" onclick="startGame()" style="background: white; color: black;">Spiel starten 🚀</button>
    </div>

    <div id="game-area" class="hidden">
        
        <div class="card">
            <h2 id="status">Lade Datenbank...</h2>
            <button id="random-btn" onclick="pickRandomSong()" class="hidden" style="font-size: 1.2em; background: #1DB954;">🎲 Zufälliger Song</button>
            
            <iframe id="video-player" src="" frameborder="0" allow="autoplay"></iframe>
            
            <div id="controls" class="hidden" style="margin-top: 15px;">
                <button id="play-btn" onclick="startVideo()" style="background: #ffffff; color: black;">▶️ Musik abspielen</button>
                <button id="stop-btn" onclick="stopVideo()" style="background: #cc0000; color: white;">⏹️ Stopp</button>
                <br>
                <button id="reveal-btn" onclick="revealInfo()" class="btn-secondary" style="margin-top: 10px;">👁️ Lösung zeigen</button>
            </div>

            <div id="song-info" class="hidden">
                <div class="song-display">
                    <strong id="display-title"></strong><br>
                    <span id="display-year"></span>
                </div>
            </div>
        </div>

        <div id="scoreboard" class="scoreboard"></div>
        
        <div style="margin-top: 40px; padding-bottom: 40px;">
            <p id="db-count" style="font-size: 0.8em; color: #666;">Songs in DB: 0</p>
            <button onclick="resetGame()" class="btn-danger">Alles zurücksetzen & neue Runde</button>
        </div>
    </div>

    <script>
        // HIER DEINEN GOOGLE SHEETS CSV-LINK EINFÜGEN:
        const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRJkS7ZgyqTEyjfOdiQ0wFlhllm_ZeQHQo9S5z597Jq7ejqKjVjZRTIg9FHoaEx-rGGhsOCAEg5PL1G/pubhtml";

        let songDatenbank = [];
        let players = [];
        let currentSong = null;

        // 1. Daten beim Start laden
        window.onload = async function() {
            await loadSongsFromSheet();
            const saved = localStorage.getItem('hitster_db_players');
            if (saved) {
                players = JSON.parse(saved);
                showGame();
            }
        };

        async function loadSongsFromSheet() {
            try {
                const response = await fetch(sheetUrl);
                const data = await response.text();
                
                // Wir teilen den Text in Zeilen
                const rows = data.split(/\r?\n/); // Erkennt verschiedene Zeilenumbrüche
                
                const geladeneSongs = [];

                // Wir gehen jede Zeile durch (starten bei 1, um Header zu überspringen)
                for (let i = 1; i < rows.length; i++) {
                    if (!rows[i].trim()) continue; // Überspringe komplett leere Zeilen

                    const columns = rows[i].includes(';') ? rows[i].split(';') : rows[i].split(',');
                    
                    const song = {
                        ytId: columns[0] ? columns[0].trim() : "",
                        titel: columns[1] ? columns[1].trim() : "",
                        interpret: columns[2] ? columns[2].trim() : "",
                        jahr: columns[3] ? columns[3].trim() : ""
                    };

                    // DER FILTER: Nur hinzufügen, wenn die ytId genau 11 Zeichen hat 
                    // (oder zumindest länger als 5 ist und nicht "undefined" heißt)
                    if (song.ytId && song.ytId.length > 5 && song.ytId !== "undefined") {
                        geladeneSongs.push(song);
                    }
                }

                songDatenbank = geladeneSongs;

                document.getElementById('db-count').innerText = "Songs in DB: " + songDatenbank.length;
                document.getElementById('status').innerText = songDatenbank.length > 0 ? "Bereit zum Spielen!" : "DB leer - Links prüfen!";
                if(songDatenbank.length > 0) {
                    document.getElementById('random-btn').classList.remove('hidden');
                }
            } catch (error) {
                document.getElementById('status').innerText = "Fehler beim Laden!";
                console.error(error);
            }
        }

        // 2. Setup Logik
        function createPlayerInputs(num) {
            const container = document.getElementById('name-inputs');
            container.innerHTML = "<h3>Namen:</h3>";
            for(let i=1; i<=num; i++) {
                container.innerHTML += `<input type="text" id="name-${i}" placeholder="Spieler ${i}">`;
            }
            document.getElementById('start-game-btn').classList.remove('hidden');
        }

        function startGame() {
            const inputs = document.querySelectorAll('#name-inputs input');
            players = Array.from(inputs).map(inp => ({ 
                name: inp.value || "Spieler", 
                score: 0,
                timeline: [] 
            }));
            localStorage.setItem('hitster_db_players', JSON.stringify(players));
            showGame();
        }

        function showGame() {
            document.getElementById('setup-area').classList.add('hidden');
            document.getElementById('game-area').classList.remove('hidden');
            renderScoreboard();
        }

        // 3. Song Logik
        function pickRandomSong() {
            if (songDatenbank.length === 0) return alert("DB leer!");
            const randomIndex = Math.floor(Math.random() * songDatenbank.length);
            currentSong = songDatenbank[randomIndex];
            
            document.getElementById('status').innerText = "Song gefunden!";
            document.getElementById('display-title').innerText = currentSong.titel + " - " + currentSong.interpret;
            document.getElementById('display-year').innerText = "Jahr: " + currentSong.jahr;
            
            document.getElementById('controls').classList.remove('hidden');
            document.getElementById('song-info').classList.add('hidden');
            document.getElementById('video-player').src = ""; 
            document.getElementById('play-btn').innerText = "▶️ Musik abspielen";
        }

        function startVideo() {
            if(currentSong) {
                document.getElementById('video-player').src = "https://www.youtube.com/embed/" + currentSong.ytId + "?autoplay=1";
                document.getElementById('play-btn').innerText = "🎵 Musik läuft...";
            }
        }

        function stopVideo() {
            document.getElementById('video-player').src = ""; 
            document.getElementById('play-btn').innerText = "▶️ Musik fortsetzen";
        }

        function revealInfo() {
            stopVideo();
            document.getElementById('song-info').classList.remove('hidden');
        }

        // 4. Scoreboard & Timeline Logik
        function renderScoreboard() {
            const sb = document.getElementById('scoreboard');
            sb.innerHTML = "";
            players.forEach((p, i) => {
                // Timeline sortieren (Kleinstes Jahr zuerst)
                const sortedTimeline = [...p.timeline].sort((a, b) => parseInt(a.jahr) - parseInt(b.jahr));
                
                const timelineHTML = sortedTimeline.map(song => `
                    <div class="timeline-card">
                        <span class="timeline-year">${song.jahr}</span> 
                        ${song.titel}
                    </div>
                `).join("");

                sb.innerHTML += `
                    <div class="player-score">
                        <strong>${p.name}</strong>
                        <span class="score-val" id="sc-${i}">${p.score}</span>
                        <button onclick="addSongToPlayer(${i})">➕ Punkt & Karte</button>
                        <button onclick="updateScore(${i}, -1)" style="background:#555; padding: 5px 10px; font-size: 0.8em;">-1</button>
                        <div class="timeline">
                            ${timelineHTML}
                        </div>
                    </div>`;
            });
        }

        function addSongToPlayer(playerIndex) {
            if (!currentSong) return alert("Wähle erst einen Song!");
            
            const wonSong = {
                titel: currentSong.titel,
                jahr: currentSong.jahr
            };

            players[playerIndex].timeline.push(wonSong);
            players[playerIndex].score = players[playerIndex].timeline.length;

            localStorage.setItem('hitster_db_players', JSON.stringify(players));
            renderScoreboard();
        }

        function updateScore(i, v) {
            if (v < 0 && players[i].timeline.length > 0) {
                players[i].timeline.pop();
            }
            players[i].score = players[i].timeline.length;
            localStorage.setItem('hitster_db_players', JSON.stringify(players));
            renderScoreboard();
        }

        function resetGame() {
            if(confirm("Alles löschen und von vorne beginnen?")) {
                localStorage.removeItem('hitster_db_players');
                location.reload();
            }
        }
    </script>
</body>
</html>

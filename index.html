<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 🎵 Hit-Quiz 🎵 </title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Roboto, sans-serif; text-align: center; background-color: #0d0221; color: #e0e0e0; padding: 20px; background-image: linear-gradient(180deg, #0d0221 0%, #0f0c29 100%); }
        .card { background: rgba(25, 25, 40, 0.8); border-radius: 20px; padding: 25px; margin-bottom: 25px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); max-width: 550px; margin-left: auto; margin-right: auto; backdrop-filter: blur(4px); }
        .hidden { display: none; }
        
        button { background: #ff0055; border: none; color: white; padding: 14px 28px; border-radius: 50px; cursor: pointer; font-size: 1em; margin: 8px; font-weight: bold; text-transform: uppercase;letter-spacing: 1px;transition: all 0.3s ease; box-shadow: 0 0 10px rgba(255, 0, 85, 0.3); }
        button:hover { transform: scale(1.08) translateY(-3px); background: #ff2e77; box-shadow: 0 0 20px rgba(255, 0, 85, 0.8); }
        .btn-secondary { background: #00d4ff; box-shadow: 0 0 10px rgba(0, 212, 255, 0.3); }
        .btn-secondary:hover { background: #33e0ff; box-shadow: 0 0 20px rgba(0, 212, 255, 0.8); }
        
        .btn-danger { background: #cc0000; font-size: 0.8em; opacity: 0.7; }
        
        input { padding: 15px; border-radius: 12px; border: 1px solid #333; background: #1a1a2e; color: #00d4ff; width: 85%; margin-bottom: 15px; font-size: 1.1em; outline: none; }
        input:focus { border-color: #ff0055; box-shadow: 0 0 10px rgba(255, 0, 85, 0.5); }
        
        #video-player { position: absolute; left: -9999px; width: 1px; height: 1px; }

        .scoreboard { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
        .player-score { background: rgba(20, 20, 35, 0.9); padding: 20px; border-radius: 15px; min-width: 240px; border: 1px solid #333; text-align: center; }
        .score-val { font-size: 3em; display: block; margin: 10px 0; color: ##bcff00; text-shadow: 0 0 15px rgba(188, 255, 0, 0.6); font-weight: 'Courier New', Courier, monospace; }
        
        /* TIMELINE STYLES */
        .timeline { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .timeline-card { background: #161625; padding: 12px; border-radius: 10px; border-left: 5px solid #ff0055; text-align: left; font-size: 0.9em; box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.3); transition: transform 0.2s; animation: fadeIn 0.4s ease-out; font-size: 0.9em; }
        .timeline-card:hover { transform: translateX(5px); }
        .timeline-year { font-weight: bold; color: #00d4ff; margin-right: 10px; font-size: 1.1em; }

        #song-info { animation: slideInUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .song-display { color: #bcff00; font-size: 1.4em; margin-top: 20px; border-top: 1px solid #333; padding-top: 20px; text-shadow: 0 0 10px rgba(188, 255, 0, 0.4); }

        /* Gold-Effekt für den Gewinner */
    .winner-glow { color: #ffd700 !important; text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 0 40px rgba(255, 215, 0, 0.4); font-size: 1.5em; display: inline-block; animation: pulse-gold 1.5s infinite alternate; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInUp { from { opacity: 0; transform: translateY(30px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes pulse.gold { from { transform: scale(1); } to { transform: sclae (1.1) } }
    </style>
</head>
<body>

    <div id="setup-area" class="card">
        <h2>👥 Hit-Quiz 👥</h2>
        <p>Wie viele Personen spielen?</p>
        <button onclick="createPlayerInputs(2)">2 Spieler</button>
        <button onclick="createPlayerInputs(3)">3 Spieler</button>
        <button onclick="createPlayerInputs(4)">4 Spieler</button>
        
        <div id="name-inputs" style="margin-top: 20px;"></div>
        <button id="start-game-btn" class="hidden" onclick="startGame()" style="background: white; color: black;">Spiel starten 🚀</button>
    </div>

    <div id="game-area" class="hidden">
        
        <div class="card">
            <h2 id="status">Lade Datenbank...</h2>
            <button id="random-btn" onclick="pickRandomSong()" class="hidden" style="font-size: 1.2em; background: #1DB954;">🎲 Zufälliger Song</button>
            
            <iframe id="video-player" src="" frameborder="0" allow="autoplay"></iframe>
            
            <div id="controls" class="hidden" style="margin-top: 15px;">
                <button id="play-btn" onclick="startVideo()" style="background: #ffffff; color: black;">▶️ Musik abspielen</button>
                <button id="stop-btn" onclick="stopVideo()" style="background: #cc0000; color: white;">⏹️ Stopp</button>
                <br>
                <button id="reveal-btn" onclick="revealInfo()" class="btn-secondary" style="margin-top: 10px;">👁️ Lösung zeigen</button>
            </div>

            <div id="song-info" class="hidden">
                <div class="song-display">
                    <strong id="display-title"></strong><br>
                    <span id="display-year"></span>
                </div>
            </div>
        </div>

        <div id="scoreboard" class="scoreboard"></div>
        
        <div style="margin-top: 40px; padding-bottom: 40px;">
            <p id="db-count" style="font-size: 0.8em; color: #666;">Songs in DB: 0</p>
            <button onclick="resetGame()" class="btn-danger">Alles zurücksetzen & neue Runde</button>
        </div>
    </div>

    <script>
    const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRJkS7ZgyqTEyjfOdiQ0wFlhllm_ZeQHQo9S5z597Jq7ejqKjVjZRTIg9FHoaEx-rGGhsOCAEg5PL1G/pub?output=csv";

    let songDatenbank = [];
    let players = [];
    let currentSong = null;
    let playedSongIds = JSON.parse(localStorage.getItem('hitster_played_songs')) || [];

    window.onload = async function() {
        await loadSongsFromSheet();
        const saved = localStorage.getItem('hitster_db_players');
        if (saved) {
            players = JSON.parse(saved);
            showGame();
        }
    };

    async function loadSongsFromSheet() {
        try {
            const response = await fetch(sheetUrl);
            const data = await response.text();
            const rows = data.split(/\r?\n/);
            const geladeneSongs = [];

            for (let i = 1; i < rows.length; i++) {
                if (!rows[i].trim()) continue;
                const columns = rows[i].includes(';') ? rows[i].split(';') : rows[i].split(',');
                
                const song = {
                    ytId: columns[0] ? columns[0].trim() : "",
                    titel: columns[1] ? columns[1].trim() : "",
                    interpret: columns[2] ? columns[2].trim() : "",
                    jahr: columns[3] ? columns[3].trim() : ""
                };

                if (song.ytId && song.ytId.length > 5 && song.ytId !== "undefined") {
                    geladeneSongs.push(song);
                }
            }

            songDatenbank = geladeneSongs;
            updateDbCounter();
            
            document.getElementById('status').innerText = songDatenbank.length > 0 ? "Bereit zum Spielen!" : "DB leer - Links prüfen!";
            if(songDatenbank.length > 0) {
                document.getElementById('random-btn').classList.remove('hidden');
            }
        } catch (error) {
            document.getElementById('status').innerText = "Fehler beim Laden!";
            console.error(error);
        }
    }

    function updateDbCounter() {
        const remaining = songDatenbank.filter(s => !playedSongIds.includes(s.ytId)).length;
        document.getElementById('db-count').innerText = `Verfügbare Songs: ${remaining} (Gespielt: ${playedSongIds.length})`;
    }

    function createPlayerInputs(num) {
        const container = document.getElementById('name-inputs');
        container.innerHTML = "<h3>Namen:</h3>";
        for(let i=1; i<=num; i++) {
            container.innerHTML += `<input type="text" id="name-${i}" placeholder="Spieler ${i}">`;
        }
        document.getElementById('start-game-btn').classList.remove('hidden');
    }

    function startGame() {
        const inputs = document.querySelectorAll('#name-inputs input');
        players = Array.from(inputs).map(inp => ({ 
            name: inp.value || "Spieler", 
            score: 0,
            timeline: [] 
        }));
        localStorage.setItem('hitster_db_players', JSON.stringify(players));
        showGame();
    }

    function showGame() {
        document.getElementById('setup-area').classList.add('hidden');
        document.getElementById('game-area').classList.remove('hidden');
        renderScoreboard();
    }

    function pickRandomSong() {
        // Filtert die Datenbank: Nur Songs, die noch nicht in playedSongIds sind
        const pool = songDatenbank.filter(s => !playedSongIds.includes(s.ytId));
        
        if (pool.length === 0) {
            alert("Alle Songs aus der Liste wurden bereits gespielt! Setze die Liste zurück, um von vorn zu beginnen.");
            return;
        }

        const randomIndex = Math.floor(Math.random() * pool.length);
        currentSong = pool[randomIndex];
        
        document.getElementById('status').innerText = "Song gefunden!";
        document.getElementById('display-title').innerText = currentSong.titel + " - " + currentSong.interpret;
        document.getElementById('display-year').innerText = "Jahr: " + currentSong.jahr;
        
        document.getElementById('controls').classList.remove('hidden');
        document.getElementById('song-info').classList.add('hidden');
        document.getElementById('video-player').src = ""; 
        document.getElementById('play-btn').innerText = "▶️ Musik abspielen";
    }

    function startVideo() {
        if(currentSong) {
            document.getElementById('video-player').src = "https://www.youtube.com/embed/" + currentSong.ytId + "?autoplay=1";
            document.getElementById('play-btn').innerText = "🎵 Musik läuft...";
        }
    }

    function stopVideo() {
        document.getElementById('video-player').src = ""; 
        document.getElementById('play-btn').innerText = "▶️ Musik fortsetzen";
    }

    function revealInfo() {
        stopVideo();
        document.getElementById('song-info').classList.remove('hidden');
        
        // Sobald die Info gezeigt wird, gilt der Song als "benutzt"
        if (currentSong && !playedSongIds.includes(currentSong.ytId)) {
            playedSongIds.push(currentSong.ytId);
            localStorage.setItem('hitster_played_songs', JSON.stringify(playedSongIds));
            updateDbCounter();
        }
    }

    function renderScoreboard() {
        const sb = document.getElementById('scoreboard');
        sb.innerHTML = "";
        players.forEach((p, i) => {
            const sortedTimeline = [...p.timeline].sort((a, b) => parseInt(a.jahr) - parseInt(b.jahr));
            const timelineHTML = sortedTimeline.map(song => `
                <div class="timeline-card">
                    <span class="timeline-year">${song.jahr}</span> 
                    ${song.titel}
                </div>
            `).join("");

            sb.innerHTML += `
                <div class="player-score">
                    <strong>${p.name}</strong>
                    <span class="score-val" id="sc-${i}">${p.score}</span>
                    <button onclick="addSongToPlayer(${i})">➕ Punkt & Karte</button>
                    <button onclick="updateScore(${i}, -1)" style="background:#555; padding: 5px 10px; font-size: 0.8em;">-1</button>
                    <div class="timeline">
                        ${timelineHTML}
                    </div>
                </div>`;
        });
    }

    function addSongToPlayer(playerIndex) {
        if (!currentSong) return alert("Wähle erst einen Song!");
    
        const wonSong = {
            titel: currentSong.titel,
            jahr: currentSong.jahr
        };

        players[playerIndex].timeline.push(wonSong);
        players[playerIndex].score = players[playerIndex].timeline.length;

        localStorage.setItem('hitster_db_players', JSON.stringify(players));
        renderScoreboard();

        // GEWINN-CHECK bei 10 Punkten
        if (players[playerIndex].score >= 10) {
            // 1. Namen golden hervorheben
            const playerElements = document.querySelectorAll('.player-score strong');
            if(playerElements[playerIndex]) {
                playerElements[playerIndex].classList.add('winner-glow');
            }

        // 2. Konfetti zünden
        let duration = 5 * 1000;
        let animationEnd = Date.now() + duration;
        let defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 1000 };

        function randomInRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        let interval = setInterval(function() {
            let timeLeft = animationEnd - Date.now();
            if (timeLeft <= 0) return clearInterval(interval);

            let particleCount = 50 * (timeLeft / duration);
            confetti(Object.assign({}, defaults, { 
                particleCount, 
                origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } 
            }));
            confetti(Object.assign({}, defaults, { 
                particleCount, 
                origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } 
            }));
        }, 250);

        // 3. Dialog leicht verzögert anzeigen
        setTimeout(() => {
            alert("🏆 SIEG FÜR " + players[playerIndex].name.toUpperCase() + "! 🏆\n\nWahnsinn, du hast 10 Punkte erreicht!");
            if(confirm("Möchtest du eine neue Runde mit den gleichen Spielern starten?")) {
                resetScoresButKeepSongs();
            }
        }, 1200);
    }
}

    function resetScoresButKeepSongs() {
        players.forEach(p => {
            p.score = 0;
            p.timeline = [];
        });
        localStorage.setItem('hitster_db_players', JSON.stringify(players));
        renderScoreboard();
        document.getElementById('status').innerText = "Neue Runde gestartet!";
    }

    function updateScore(i, v) {
        if (v < 0 && players[i].timeline.length > 0) {
            players[i].timeline.pop();
        }
        players[i].score = players[i].timeline.length;
        localStorage.setItem('hitster_db_players', JSON.stringify(players));
        renderScoreboard();
    }

    function resetGame() {
        if(confirm("Alles löschen (auch gespielte Songs) und komplett neu starten?")) {
            localStorage.removeItem('hitster_db_players');
            localStorage.removeItem('hitster_played_songs');
            location.reload();
        }
    }
</script>
</body>
</html>
